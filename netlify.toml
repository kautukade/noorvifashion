# Noorvi Fashion — Netlify configuration
# Client-demo branding deploy: shop name is editable from Admin → Store Information.
[build]
  command = "npm run build"
  publish = "dist"

# SPA routing: send every path to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
# Production refresh: client shop name editor is available in Homepage.
# Production branch synced with editable client shop-name controls.
